services:
  postgres:
    image: postgres:18
    container_name: boxtech-reporting-postgres
    environment:
      POSTGRES_DB: boxtech_reporting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: boxtech-reporting-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env.docker
    ports:
      - "8000:8000"

volumes:
  postgres_data: